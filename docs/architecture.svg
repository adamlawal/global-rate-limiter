<svg xmlns="http://www.w3.org/2000/svg" width="800" height="465" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">Global Rate Limiter service architecture</title>
  <desc id="desc">Clients reach a load balancer which distributes to stateless rate limiter replicas. Replicas atomically check Redis and asynchronously stream approval events to analytics. The dashboard reads analytics from Redis Streams.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#44506d"/></marker><style>text{font-family:Arial,sans-serif;fill:#172033}.t{font-size:31px;font-weight:700}.s{font-size:22px;fill:#536078}.n{font-size:24px;font-weight:700}.box{fill:#fff;stroke:#b9c3d5;stroke-width:3}.blue{fill:#e8edff;stroke:#5b6ee1}.green{fill:#e3f7ef;stroke:#32a776}.orange{fill:#fff2dc;stroke:#dd8b1d}.line{stroke:#44506d;stroke-width:4;fill:none;marker-end:url(#arrow)}.dash{stroke-dasharray:12 10}</style></defs>
  <rect width="1600" height="930" fill="#f6f8fc"/>
  <text x="80" y="80" class="t" style="font-size:42px">Global Rate Limiter as a Service</text><text x="80" y="118" class="s">Stateless replicas share one atomic quota authority; analytics never blocks a rate decision.</text>
  <rect class="box" x="85" y="255" width="245" height="135" rx="18"/><text x="207" y="315" text-anchor="middle" class="n">API clients</text><text x="207" y="350" text-anchor="middle" class="s">X-Client-Id</text>
  <rect class="box blue" x="440" y="255" width="270" height="135" rx="18"/><text x="575" y="315" text-anchor="middle" class="n">Nginx gateway</text><text x="575" y="350" text-anchor="middle" class="s">health checks + routing</text>
  <rect class="box blue" x="835" y="155" width="280" height="120" rx="18"/><text x="975" y="208" text-anchor="middle" class="n">Limiter replica 1</text><text x="975" y="242" text-anchor="middle" class="s">HTTP + Lua EVAL</text>
  <rect class="box blue" x="835" y="345" width="280" height="120" rx="18"/><text x="975" y="398" text-anchor="middle" class="n">Limiter replica N</text><text x="975" y="432" text-anchor="middle" class="s">same configuration</text>
  <rect class="box green" x="1240" y="230" width="275" height="165" rx="18"/><text x="1377" y="285" text-anchor="middle" class="n">Redis / HA cache</text><text x="1377" y="320" text-anchor="middle" class="s">atomic quota counters</text><text x="1377" y="350" text-anchor="middle" class="s">approval event stream</text>
  <rect class="box orange" x="835" y="635" width="280" height="125" rx="18"/><text x="975" y="687" text-anchor="middle" class="n">Usage dashboard</text><text x="975" y="722" text-anchor="middle" class="s">filters + trend graphs</text>
  <rect class="box" x="1240" y="635" width="275" height="125" rx="18"/><text x="1377" y="687" text-anchor="middle" class="n">Billing / analytics</text><text x="1377" y="722" text-anchor="middle" class="s">stream consumers</text>
  <path class="line" d="M330 322 H440"/><path class="line" d="M710 300 L835 215"/><path class="line" d="M710 345 L835 405"/><path class="line" d="M1115 215 L1240 275"/><path class="line" d="M1115 405 L1240 350"/><path class="line dash" d="M975 275 V635"/><path class="line dash" d="M975 465 V635"/><path class="line" d="M1115 697 H1240"/>
  <text x="1125" y="175" class="s">atomic INCR + expiry</text><text x="1000" y="555" class="s">asynchronous XADD</text>
  <rect x="85" y="820" width="1430" height="65" rx="12" fill="#e9edf5"/><text x="115" y="860" class="s"><tspan font-weight="700" fill="#172033">Failure policy:</tspan> if the cache is unavailable or slow, replicas fail open and retain bounded analytics events for retry; traffic is not blocked.</text>
</svg>
