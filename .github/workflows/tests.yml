name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run suite including multi-process Redis integration
        run: python -m unittest discover -s test -v
