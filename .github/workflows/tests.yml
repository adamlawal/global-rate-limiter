name: tests
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check formatting and imports
        run: |
          python -m pip install 'ruff>=0.14,<1'
          ruff format --check src test benchmarks
          ruff check --select E4,E7,E9,F,I src test benchmarks
      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
      - name: Run suite including multi-process Redis integration
        run: python -m unittest discover -s test -v
